name: Publish Release

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Platform target to publish"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - linux-x64
          - macos-arm64
          - macos-intel
  push:
    tags:
      - "v*"

concurrency:
  group: publish-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CI: true

jobs:
  define-matrix:
    name: Select release targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Build matrix
        id: set-matrix
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            case "${{ inputs.target }}" in
              linux-x64)
                echo 'matrix={"include":[{"name":"linux-x64","platform":"ubuntu-24.04","args":"--bundles appimage"}]}' >> "$GITHUB_OUTPUT"
                ;;
              macos-arm64)
                echo 'matrix={"include":[{"name":"macos-arm64","platform":"macos-latest","args":""}]}' >> "$GITHUB_OUTPUT"
                ;;
              macos-intel)
                echo 'matrix={"include":[{"name":"macos-intel","platform":"macos-15-intel","args":""}]}' >> "$GITHUB_OUTPUT"
                ;;
              all)
                echo 'matrix={"include":[{"name":"linux-x64","platform":"ubuntu-24.04","args":"--bundles appimage"},{"name":"macos-arm64","platform":"macos-latest","args":""},{"name":"macos-intel","platform":"macos-15-intel","args":""}]}' >> "$GITHUB_OUTPUT"
                ;;
              *)
                echo "Unsupported workflow_dispatch target: ${{ inputs.target }}"
                exit 1
                ;;
            esac
          else
            echo 'matrix={"include":[{"name":"linux-x64","platform":"ubuntu-24.04","args":"--bundles appimage"},{"name":"macos-arm64","platform":"macos-latest","args":""},{"name":"macos-intel","platform":"macos-15-intel","args":""}]}' >> "$GITHUB_OUTPUT"
          fi

  publish-tauri:
    needs: define-matrix
    name: Publish (${{ matrix.name }})
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    environment:
      name: release
      url: https://github.com/wharley/DevCommandCenter/releases
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.define-matrix.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]]; then
            echo "Missing required secret: TAURI_SIGNING_PRIVATE_KEY"
            exit 1
          fi

      - name: Validate required Apple secrets
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: |
          set -euo pipefail

          missing=0
          for var in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_TEAM_ID \
            APPLE_ID \
            APPLE_PASSWORD; do
            if [[ -z "${!var}" ]]; then
              echo "Missing required secret: ${var}"
              missing=1
            fi
          done

          if [[ "${missing}" -ne 0 ]]; then
            exit 1
          fi

      - name: Install Linux system deps
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            squashfs-tools \
            fuse

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn

      - name: Enable Corepack (Yarn)
        run: corepack enable

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-engines

      - name: Publish release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: ${{ github.ref_type == 'tag' && format('Dev Command Center {0}', github.ref_name) || 'Dev Command Center v__VERSION__' }}
          releaseBody: "See the release assets to download and install this version."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
