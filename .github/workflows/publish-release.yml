name: Publish Release
# Named after the release commit however the tag arrives: a tag pushed on its
# own (the commit already on main) would otherwise show only "Publish Release".
run-name: "${{ github.event_name == 'push' && format('chore(release): {0}', github.ref_name) || 'Build and verify the release (no publish)' }}"

# The native app (apps/native): macOS Apple silicon and Intel (.app.tar.gz for
# the updater, notarized DMG) and Linux x86_64 (.deb), each archive signed with
# the updater key, and the latest.json both the native app and a v0.2.0 Tauri
# desktop read. A tag publishes a draft release; a manual run only builds and
# verifies.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: publish-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CI: true

jobs:
  version:
    name: Release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Read and check the version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([0-9.]*\)"$/\1/p' apps/native/Cargo.toml | head -1)"
          if [[ -z "${version}" ]]; then
            echo "No version in apps/native/Cargo.toml"
            exit 1
          fi
          # The daemon outlives the app and is reused while it reports the
          # app's version, so its crate carries the same number.
          daemon="$(sed -n 's/^version = "\([0-9.]*\)"$/\1/p' crates/dcc-server/Cargo.toml | head -1)"
          if [[ "${daemon}" != "${version}" ]]; then
            echo "crates/dcc-server/Cargo.toml (${daemon}) does not match apps/native/Cargo.toml (${version})"
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match apps/native/Cargo.toml (${version})"
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  macos:
    needs: version
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    environment:
      name: release
      url: https://github.com/wharley/DevCommandCenter/releases
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: aarch64
          - runner: macos-15-intel
            arch: x64
    env:
      VERSION: ${{ needs.version.outputs.version }}
      APP: apps/native/target/release/bundle/Dev Command Center.app
    steps:
      - uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for var in TAURI_SIGNING_PRIVATE_KEY APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY APPLE_TEAM_ID APPLE_ID APPLE_PASSWORD; do
            if [[ -z "${!var}" ]]; then
              echo "Missing required secret: ${var}"
              missing=1
            fi
          done
          exit "${missing}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn

      - name: Enable Corepack (Yarn)
        run: corepack enable

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/native -> target

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-engines

      - name: Import the Developer ID certificate
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="${RUNNER_TEMP}/dcc-signing.keychain-db"
          password="$(uuidgen)"
          certificate="${RUNNER_TEMP}/certificate.p12"
          echo "${APPLE_CERTIFICATE}" | base64 --decode > "${certificate}"
          security create-keychain -p "${password}" "${keychain}"
          security set-keychain-settings -lut 21600 "${keychain}"
          security unlock-keychain -p "${password}" "${keychain}"
          security import "${certificate}" -P "${APPLE_CERTIFICATE_PASSWORD}" -A -t cert -f pkcs12 -k "${keychain}"
          security set-key-partition-list -S apple-tool:,apple: -k "${password}" "${keychain}" >/dev/null
          security list-keychains -d user -s "${keychain}" $(security list-keychains -d user | tr -d '"')
          rm -f "${certificate}"

      - name: Build and sign the app
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: node scripts/native-local.mjs build --release "${VERSION}"

      - name: Notarize the app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: scripts/notarize-macos.sh "${APP}"

      - name: Verify the bundle and launch it
        run: python3 scripts/verify-macos-bundle.py "${APP}" --smoke-test

      - name: Updater archive and DMG
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/dist"
          mkdir -p "${out}"
          bundle="$(dirname "${APP}")"

          # One "Dev Command Center.app" at the top: what both updaters unpack.
          archive="${out}/Dev.Command.Center_${VERSION}_${ARCH}.app.tar.gz"
          tar -czf "${archive}" -C "${bundle}" "Dev Command Center.app"
          npx --yes @tauri-apps/cli@2.11.0 signer sign "${archive}"
          test -s "${archive}.sig"

          staging="${RUNNER_TEMP}/dmg"
          rm -rf "${staging}" && mkdir -p "${staging}"
          ditto "${APP}" "${staging}/Dev Command Center.app"
          ln -s /Applications "${staging}/Applications"
          dmg="${out}/Dev.Command.Center_${VERSION}_${ARCH}.dmg"
          # The runner's XProtect scan sometimes holds the new image ("Resource
          # busy"); a later attempt goes through.
          for attempt in 1 2 3 4 5; do
            if hdiutil create -volname "Dev Command Center" -srcfolder "${staging}" -ov -format UDZO "${dmg}"; then
              break
            fi
            if [ "${attempt}" = 5 ]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done
          codesign --force --timestamp --sign "${APPLE_SIGNING_IDENTITY}" "${dmg}"
          scripts/notarize-macos.sh "${dmg}"
          # The landing page links releases/latest/download/Dev.Command.Center_<arch>.dmg.
          cp "${dmg}" "${out}/Dev.Command.Center_${ARCH}.dmg"

          # The archive holds the stapled, notarized app.
          check="$(mktemp -d)"
          tar -xzf "${archive}" -C "${check}"
          codesign --verify --deep --strict --verbose=2 "${check}/Dev Command Center.app"
          xcrun stapler validate "${check}/Dev Command Center.app"
          ls -la "${out}"

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.arch }}
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error

  linux:
    needs: version
    name: Linux (x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment:
      name: release
      url: https://github.com/wharley/DevCommandCenter/releases
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate the updater key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]]; then
            echo "Missing required secret: TAURI_SIGNING_PRIVATE_KEY"
            exit 1
          fi

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config curl file \
            libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev \
            libxcb1-dev libvulkan-dev libfontconfig-dev libfreetype-dev \
            libasound2-dev libzstd-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn

      - name: Enable Corepack (Yarn)
        run: corepack enable

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/native -> target

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-engines

      - name: Build the package
        run: node scripts/package-linux.mjs --release "${VERSION}"

      - name: Sign the package
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/dist"
          mkdir -p "${out}"
          deb="${out}/Dev.Command.Center_${VERSION}_amd64.deb"
          cp "target/release/bundle/deb/Dev Command Center_${VERSION}_amd64.deb" "${deb}"
          dpkg-deb --info "${deb}"
          npx --yes @tauri-apps/cli@2.11.0 signer sign "${deb}"
          test -s "${deb}.sig"
          # releases/latest/download/Dev.Command.Center_amd64.deb for the landing page.
          cp "${deb}" "${out}/Dev.Command.Center_amd64.deb"

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error

  publish:
    needs: [version, macos, linux]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    name: Draft release
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: latest.json
        run: |
          node scripts/release-latest-json.mjs --version "${VERSION}" --dir dist \
            --repo "${GITHUB_REPOSITORY}" --notes "docs/releases/v${VERSION}.md"

      - name: Create the draft release
        shell: bash
        run: |
          set -euo pipefail
          notes="docs/releases/v${VERSION}.md"
          if [[ ! -f "${notes}" ]]; then
            notes="${RUNNER_TEMP}/notes.md"
            echo "See the release assets to download and install this version." > "${notes}"
          fi
          gh release create "v${VERSION}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --draft \
            --title "Dev Command Center v${VERSION}" \
            --notes-file "${notes}"
