name: Publish Release

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Platform target to publish"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - linux-x64
          - macos-arm64
          - macos-intel
  push:
    tags:
      - "v*"

concurrency:
  group: publish-release-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.target || 'tag' }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CI: true

jobs:
  define-matrix:
    name: Select release targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Build matrix
        id: set-matrix
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            case "${{ inputs.target }}" in
              linux-x64)
                echo 'matrix={"include":[{"name":"linux-x64","platform":"ubuntu-24.04","args":"--bundles deb"}]}' >> "$GITHUB_OUTPUT"
                ;;
              macos-arm64)
                echo 'matrix={"include":[{"name":"macos-arm64","platform":"macos-latest","args":"--target aarch64-apple-darwin --bundles app,dmg","rust_target":"aarch64-apple-darwin"}]}' >> "$GITHUB_OUTPUT"
                ;;
              macos-intel)
                echo 'matrix={"include":[{"name":"macos-intel","platform":"macos-15-intel","args":"--target x86_64-apple-darwin --bundles app,dmg","rust_target":"x86_64-apple-darwin"}]}' >> "$GITHUB_OUTPUT"
                ;;
              all)
                echo 'matrix={"include":[{"name":"linux-x64","platform":"ubuntu-24.04","args":"--bundles deb"},{"name":"macos-arm64","platform":"macos-latest","args":"--target aarch64-apple-darwin --bundles app,dmg","rust_target":"aarch64-apple-darwin"},{"name":"macos-intel","platform":"macos-15-intel","args":"--target x86_64-apple-darwin --bundles app,dmg","rust_target":"x86_64-apple-darwin"}]}' >> "$GITHUB_OUTPUT"
                ;;
              *)
                echo "Unsupported workflow_dispatch target: ${{ inputs.target }}"
                exit 1
                ;;
            esac
          else
            echo 'matrix={"include":[{"name":"linux-x64","platform":"ubuntu-24.04","args":"--bundles deb"},{"name":"macos-arm64","platform":"macos-latest","args":"--target aarch64-apple-darwin --bundles app,dmg","rust_target":"aarch64-apple-darwin"},{"name":"macos-intel","platform":"macos-15-intel","args":"--target x86_64-apple-darwin --bundles app,dmg","rust_target":"x86_64-apple-darwin"}]}' >> "$GITHUB_OUTPUT"
          fi

  publish-tauri:
    needs: define-matrix
    name: Publish (${{ matrix.name }})
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    environment:
      name: release
      url: https://github.com/wharley/DevCommandCenter/releases
    strategy:
      fail-fast: false
      # tauri-action updates a shared draft release (including latest.json).
      # Serialize every matrix entry so its list/delete/upload sequence cannot
      # race another platform job.
      max-parallel: 1
      matrix: ${{ fromJSON(needs.define-matrix.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]]; then
            echo "Missing required secret: TAURI_SIGNING_PRIVATE_KEY"
            exit 1
          fi

      - name: Validate required Apple secrets
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: |
          set -euo pipefail

          missing=0
          for var in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_TEAM_ID \
            APPLE_ID \
            APPLE_PASSWORD; do
            if [[ -z "${!var}" ]]; then
              echo "Missing required secret: ${var}"
              missing=1
            fi
          done

          if [[ "${missing}" -ne 0 ]]; then
            exit 1
          fi

      - name: Install Linux system deps
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            squashfs-tools \
            fuse

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn

      - name: Enable Corepack (Yarn)
        run: corepack enable

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target || '' }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-engines

      - name: Load release notes
        id: release-notes
        shell: bash
        run: |
          set -euo pipefail

          notes_file="docs/releases/${GITHUB_REF_NAME}.md"
          if [[ -f "${notes_file}" ]]; then
            {
              echo "body<<DCC_RELEASE_NOTES_EOF"
              cat "${notes_file}"
              echo "DCC_RELEASE_NOTES_EOF"
            } >> "${GITHUB_OUTPUT}"
          else
            echo "body=See the release assets to download and install this version." >> "${GITHUB_OUTPUT}"
          fi

      - name: Publish release assets
        id: publish-release-assets
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: ${{ github.ref_type == 'tag' && format('Dev Command Center {0}', github.ref_name) || 'Dev Command Center v__VERSION__' }}
          releaseBody: ${{ steps.release-notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          # A partial manual dispatch is diagnostic only: it must never replace
          # the full-release latest.json with metadata for one platform.
          uploadUpdaterJson: ${{ github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.target == 'all') }}
          # Keep updater archive signatures even while DMGs are added as the
          # preferred direct-download installer.
          uploadUpdaterSignatures: true
          args: ${{ matrix.args }}

      # tauri-action sends assets to a draft before these local checks. Any
      # failure makes the workflow fail; discard that draft and re-run rather
      # than publishing it.
      - name: Verify signed and notarized macOS release artifacts
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          set -euo pipefail

          BUNDLE_DIR="target/${RUST_TARGET}/release/bundle"
          APP_PATH="$(find "${BUNDLE_DIR}/macos" -maxdepth 1 -type d -name '*.app' -print -quit)"
          DMG_PATH="$(find "${BUNDLE_DIR}/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          UPDATER_ARCHIVE="$(find "${BUNDLE_DIR}/macos" -maxdepth 1 -type f -name '*.app.tar.gz' -print -quit)"

          for required_path in "${APP_PATH}" "${DMG_PATH}" "${UPDATER_ARCHIVE}"; do
            if [[ -z "${required_path}" || ! -e "${required_path}" ]]; then
              echo "Missing expected macOS release artifact under ${BUNDLE_DIR}."
              find "${BUNDLE_DIR}" -maxdepth 3 -print || true
              exit 1
            fi
          done

          if [[ ! -f "${UPDATER_ARCHIVE}.sig" ]]; then
            echo "Missing Tauri updater signature: ${UPDATER_ARCHIVE}.sig"
            exit 1
          fi

          echo "Verifying Developer ID signatures..."
          codesign --verify --deep --strict --verbose=2 "${APP_PATH}"
          codesign --verify --strict --verbose=2 "${DMG_PATH}"
          codesign -dv --verbose=4 "${APP_PATH}" 2>&1 | tee /tmp/dcc-app-codesign.txt
          codesign -dv --verbose=4 "${DMG_PATH}" 2>&1 | tee /tmp/dcc-dmg-codesign.txt
          grep -q '^Authority=Developer ID Application:' /tmp/dcc-app-codesign.txt
          grep -q '^Authority=Developer ID Application:' /tmp/dcc-dmg-codesign.txt

          echo "Verifying stapled notarization tickets..."
          xcrun stapler validate "${APP_PATH}"
          xcrun stapler validate "${DMG_PATH}"

          echo "Assessing the downloadable DMG with Gatekeeper..."
          SPCTL_ARGS=(-a -vv -t open)
          if spctl --help 2>&1 | grep -q -- '--context'; then
            SPCTL_ARGS+=(--context context:primary-signature)
          fi
          spctl "${SPCTL_ARGS[@]}" "${DMG_PATH}"
