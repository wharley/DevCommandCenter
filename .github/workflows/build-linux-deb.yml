# Gera o pacote .deb (Tauri) no GitHub Actions (Linux).
# Repo privado: minutos contam; por isso o padrão é rodar só em push na main
# (após merge de PR) ou manualmente — não em todo push de feature branch.
name: Build Linux (.deb)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-linux-deb-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deb:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn

      - name: Enable Corepack (Yarn)
        run: corepack enable

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install system deps (Tauri Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-engines

      - name: Build .deb (Tauri)
        env:
          CI: true
        run: yarn exec tauri build -b deb

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: dev-command-center-linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
