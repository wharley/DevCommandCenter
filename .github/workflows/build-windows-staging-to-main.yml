name: Build Windows (staging -> main)

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: build-windows-staging-to-main-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: Windows desktop validation
    if: github.event.pull_request.head.ref == 'staging'
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn

      - name: Enable Corepack (Yarn)
        run: corepack enable

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            src-tauri/target
          key: windows-rust-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: windows-rust-

      - name: Install frontend/backend dependencies
        run: yarn install --frozen-lockfile --ignore-engines

      - name: Build Tauri for Windows (NSIS)
        run: yarn tauri build --bundles nsis

      - name: Validate NSIS installer artifact
        shell: bash
        run: |
          set -euo pipefail

          NSIS_DIR="target/release/bundle/nsis"

          if [[ ! -d "${NSIS_DIR}" ]]; then
            echo "Missing NSIS bundle directory at expected Windows path: ${NSIS_DIR}"
            exit 1
          fi

          INSTALLER_PATH="$(ls -1 "${NSIS_DIR}"/*-setup.exe 2>/dev/null | head -n 1 || true)"

          if [[ -z "${INSTALLER_PATH}" || ! -f "${INSTALLER_PATH}" ]]; then
            echo "Missing NSIS *-setup.exe installer inside ${NSIS_DIR}"
            echo "Contents of ${NSIS_DIR}:"
            ls -la "${NSIS_DIR}" || true
            exit 1
          fi

          INSTALLER_SIZE="$(wc -c < "${INSTALLER_PATH}")"
          if [[ "${INSTALLER_SIZE}" -le 0 ]]; then
            echo "NSIS installer is empty: ${INSTALLER_PATH}"
            exit 1
          fi

          echo "NSIS installer checks passed."
          echo "Installer: ${INSTALLER_PATH} (${INSTALLER_SIZE} bytes)"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dev-command-center-windows-nsis
          path: |
            target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
