[package]
name = "dcc-infra"
version = "0.0.0"
edition = "2021"
license.workspace = true
publish = false

[features]
default = []
test-support = []
guarded-undo-capture-v2 = []

[dependencies]
dcc-core = { path = "../dcc-core" }
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
keyring = { version = "=4.1.5", default-features = false, features = ["v1"] }
libc = "0.2"
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.11", features = ["json", "blocking"] }
serde = "1"
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
toml = "0.8"
url = "2"
uuid = { version = "1", features = ["v4"] }

# The Browser's session import (Chromium's macOS cookie encryption).
aes = "0.8"
cbc = "0.1"
pbkdf2 = "0.12"
sha1 = "0.10"
psl = "2"
zeroize = "1"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"

[dev-dependencies]
tempfile = "3"
