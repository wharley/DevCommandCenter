[package]
name = "dcc-infra"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
dcc-core = { path = "../dcc-core" }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
