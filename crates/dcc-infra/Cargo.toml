[package]
name = "dcc-infra"
version = "0.0.0"
edition = "2021"
license.workspace = true
publish = false

[features]
default = []
test-support = []
guarded-undo-capture-v2 = ["dep:sha2", "dep:thiserror"]

[dependencies]
dcc-core = { path = "../dcc-core" }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
keyring = { version = "=4.1.5", default-features = false, features = ["v1"] }
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.11", features = ["json"] }
serde = "1"
serde_json = "1"
sha2 = { version = "0.10", optional = true }
thiserror = { version = "2", optional = true }
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
toml = "0.8"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
