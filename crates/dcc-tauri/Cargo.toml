[package]
name = "dcc-tauri"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
dcc-core = { path = "../dcc-core" }
dcc-infra = { path = "../dcc-infra" }
dcc-providers = { path = "../dcc-providers" }
serde = { version = "1", features = ["derive"] }
specta = { version = "2.0.0-rc.24", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-specta = { version = "2.0.0-rc.24", features = ["typescript"] }
thiserror = "2"
