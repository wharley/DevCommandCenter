[package]
name = "dcc-core"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
specta = { version = "2.0.0-rc.24", features = ["derive"] }
thiserror = "2"
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
serde_json = "1"
