[package]
name = "dcc-server"
version = "0.3.6"
edition = "2021"
license.workspace = true
publish = false
description = "The DCC backend without a UI: the HTTP API, the relay, pairing, the daemon and the sidecars"

[dependencies]
dcc-core = { path = "../dcc-core" }
dcc-infra = { path = "../dcc-infra" }
dcc-tauri = { path = "../dcc-tauri" }
dcc-remote = { path = "../dcc-remote" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
portable-pty = "0.8"
flate2 = "1"
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.30"
reqwest = { version = "0.11", features = ["blocking", "json"] }
libc = "0.2"
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower = { version = "0.4", features = ["util", "limit"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
sha2 = "0.10"
hex = "0.4"
async-trait = "0.1"
base64 = "0.22"
rand = "0.8"
subtle = "2.5"
thiserror = "1"
url = "2"
futures-util = "0.3"
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"

# Desktop computer use on Linux: X11/XWayland windows (inventory, capture,
# background events, XTEST), AT-SPI 2 and the desktop portals over D-Bus.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xtest"] }
zbus = "5"
png = "0.17"

[dev-dependencies]
tempfile = "3"
dcc-infra = { path = "../dcc-infra", features = ["test-support"] }
dcc-providers = { path = "../dcc-providers" }
futures-util = "0.3"
tokio = { version = "1", features = ["test-util"] }
