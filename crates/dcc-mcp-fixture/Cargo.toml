[package]
name = "dcc-mcp-fixture"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
axum = "0.7"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
url = "2"

[dev-dependencies]
dcc-core = { path = "../dcc-core" }
dcc-infra = { path = "../dcc-infra", features = ["test-support"] }
tower = { version = "0.5", features = ["util"] }
