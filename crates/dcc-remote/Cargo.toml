[package]
name = "dcc-remote"
version = "0.0.0"
edition = "2021"
license.workspace = true
publish = false
description = "Encrypted channel between the DCC desktop and a paired phone over the relay"

[dependencies]
base64 = "0.22"
hkdf = "0.12"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
snow = "0.10"
thiserror = "2"
url = "2"
zeroize = "1"

[dev-dependencies]
hex = "0.4"
x25519-dalek = { version = "2", features = ["static_secrets"] }
