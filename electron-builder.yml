appId: com.devcommandcenter.app
productName: Dev Command Center
copyright: Copyright © 2026

directories:
  buildResources: build
  output: release

files:
  - .electron/**/*
  - dist/**/*
  - public/**/*
  - package.json
  - "!**/*.ts"
  - "!**/*.tsx"
  - "!**/*.map"
  - "!**/node_modules/.cache/**/*"

extraResources:
  - from: electron/resources/bin
    to: bin
    filter: ["**/*"]

extraMetadata:
  main: .electron/electron/main.js

asar: true

# Configurações para módulos nativos (better-sqlite3)
nodeGypRebuild: false
buildDependenciesFromSource: false

npmRebuild: true

mac:
  category: public.app-category.developer-tools
  extendInfo:
    LSEnvironment:
      PATH: "/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  icon: public/icon.png
  darkModeSupport: true
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: public/icon.png

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Development
  # icon: build/icons  # Uncomment when icons are available
  maintainer: Dev Command Center

publish:
  provider: generic
  url: https://example.com/updates
