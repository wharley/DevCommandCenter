<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta id="dcc-theme-color" name="theme-color" content="#151515" />
    <script>
      (function () {
        try {
          var key = "dcc-theme";
          var stored = localStorage.getItem(key);
          var dark = stored !== "light";
          var root = document.documentElement;
          root.classList.toggle("dark", dark);
          root.dataset.theme = dark ? "dark" : "light";
          root.style.colorScheme = dark ? "dark" : "light";
          var meta = document.getElementById("dcc-theme-color");
          if (meta) meta.setAttribute("content", dark ? "#151515" : "#fafafa");
        } catch (_) {}
      })();
    </script>
    <title>Dev Command Center</title>
    <script type="module" crossorigin src="/assets/index-uj9L6qFT.js"></script>

  </head>

    <div id="root"></div>
  </body>
</html>
