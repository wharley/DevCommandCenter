<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <defs>
    <linearGradient id="dcc-bg" x1="176" y1="144" x2="850" y2="880" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A2146"/>
      <stop offset="0.48" stop-color="#07142F"/>
      <stop offset="1" stop-color="#05091C"/>
    </linearGradient>
    <radialGradient id="dcc-aura" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(500 468) rotate(90) scale(416)">
      <stop stop-color="#1446A8" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#07142F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dcc-edge" x1="184" y1="170" x2="858" y2="862" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38D9FF"/>
      <stop offset="0.48" stop-color="#2869FF"/>
      <stop offset="1" stop-color="#8B3DFF"/>
    </linearGradient>
    <linearGradient id="dcc-flow-a" x1="282" y1="294" x2="744" y2="738" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9B4DFF"/>
      <stop offset="0.45" stop-color="#356EFF"/>
      <stop offset="1" stop-color="#20BEFF"/>
    </linearGradient>
    <linearGradient id="dcc-flow-b" x1="742" y1="294" x2="292" y2="742" gradientUnits="userSpaceOnUse">
      <stop stop-color="#35D6FF"/>
      <stop offset="0.58" stop-color="#2278FF"/>
      <stop offset="1" stop-color="#5B5BFF"/>
    </linearGradient>
    <filter id="dcc-glow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="15" result="blur"/>
    </filter>
    <filter id="dcc-shadow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020716" flood-opacity="0.58"/>
    </filter>
  </defs>

  <!-- Transparent outer padding keeps the silhouette native on macOS and Linux. -->
  <rect x="96" y="96" width="832" height="832" rx="188" fill="url(#dcc-bg)"/>
  <rect x="96" y="96" width="832" height="832" rx="188" fill="url(#dcc-aura)"/>
  <rect x="101" y="101" width="822" height="822" rx="183" stroke="url(#dcc-edge)" stroke-width="10" stroke-opacity="0.68"/>

  <!-- A restrained aura is presentation detail; the silhouette works without it. -->
  <g opacity="0.3" filter="url(#dcc-glow)" stroke-linecap="round" stroke-width="86">
    <path d="M300 326H352C416 326 430 384 430 432C430 480 461 505 500 542C538 578 552 618 586 659C614 693 654 710 716 710" stroke="#784BFF"/>
    <path d="M724 326H672C608 326 594 384 594 432C594 480 563 505 524 542C486 578 472 618 438 659C410 693 370 710 308 710" stroke="#1C9CFF"/>
    <path d="M512 270V405C512 456 548 477 548 520C548 563 512 584 512 635V754" stroke="#25B8FF"/>
    <path d="M270 512H405C456 512 477 476 520 476C563 476 584 512 635 512H754" stroke="#2879FF"/>
  </g>

  <!-- Eight endpoints, four continuous flows, one orchestration knot. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="68" filter="url(#dcc-shadow)">
    <path d="M300 326H352C416 326 430 384 430 432C430 480 461 505 500 542C538 578 552 618 586 659C614 693 654 710 716 710" stroke="url(#dcc-flow-a)"/>
    <path d="M724 326H672C608 326 594 384 594 432C594 480 563 505 524 542C486 578 472 618 438 659C410 693 370 710 308 710" stroke="url(#dcc-flow-b)"/>
    <path d="M512 270V405C512 456 548 477 548 520C548 563 512 584 512 635V754" stroke="url(#dcc-flow-b)"/>
    <path d="M270 512H405C456 512 477 476 520 476C563 476 584 512 635 512H754" stroke="url(#dcc-flow-a)"/>
  </g>

  <!-- The command core preserves a subtle link to the original terminal mark. -->
  <path d="M512 457L567 512L512 567L457 512L512 457Z" fill="#07132D" stroke="url(#dcc-edge)" stroke-width="12"/>
  <path d="M491 486L518 512L491 538M518 538H541" stroke="url(#dcc-flow-b)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
