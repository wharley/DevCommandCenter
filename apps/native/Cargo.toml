[package]
name = "dcc-native"
version = "0.3.4"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Native GPUI frontend for Dev Command Center"

[lib]
name = "dcc_native"
path = "src/lib.rs"

[[bin]]
name = "dcc-native"
path = "src/main.rs"

[dependencies]
# Pinned on purpose: same GPUI snapshot Monocode Native ships on.
gpui = { package = "gpui-pre", version = "=0.3.9", default-features = false }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", default-features = false, features = ["font-kit", "runtime_shaders", "x11", "wayland"] }
serde = { version = "1", features = ["derive"] }
# A request id per feedback report (the desktop's `crypto.randomUUID`).
uuid = { version = "1", features = ["v4"] }
serde_json = "1"
dirs = "6"
anyhow = "1"
chrono = "0.4"
futures = "0.3"
# The markdown's remote images (`app::image_http`), the backend's same version.
reqwest = { version = "0.11", features = ["blocking"] }
# The updater (`data::updater`): the release's minisign signature and versions.
minisign-verify = "0.2"
semver = "1"
base64 = "0.22"
# The relay pairing QR in Settings → Conexões (encoded only; drawn by GPUI).
qrcode = { version = "0.14", default-features = false }
smallvec = "1"
unicode-segmentation = "1"
# Project logos: decode an upload and write the 64px PNG DCC stores (both
# already in the tree through GPUI).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
resvg = "0.46"
# Assistant and user messages are GitHub-flavoured markdown (Streamdown on the desktop).
pulldown-cmark = { version = "0.13", default-features = false }
dcc-core = { path = "../../crates/dcc-core" }
dcc-infra = { path = "../../crates/dcc-infra" }
# The provider descriptors, for the model picker before the desktop answers.
dcc-providers = { path = "../../crates/dcc-providers" }
# The whole backend, hosted here when no desktop serves the port
# (`dcc_server::host`): sessions, terminals, the agents' MCP, the API.
dcc-server = { path = "../../crates/dcc-server" }
dcc-tauri = { path = "../../crates/dcc-tauri" }
# Diffs (`@pierre/diffs` on the desktop): line and word changes, and
# TextMate-grammar highlighting like its Shiki, with the Pierre themes.
similar = { version = "2", features = ["inline"] }
# The editor's find with "Regexp" on (already in the tree).
regex = "1"
# The terminal's local server addresses (already in the tree through dcc-core).
url = "2"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.4", default-features = false, features = ["syntect-fancy"] }
# The terminal dock's screen and scrollback (xterm.js on the desktop); the
# shells themselves run in the desktop's process.
alacritty_terminal = { version = "0.26", default-features = false }
# The Browser's page: the system's engine (WKWebView, WebView2, WebKitGTK)
# as a child view of the GPUI window, the same library the Tauri app uses.
wry = "0.57"
# Agent requests waiting on the person, as a system notification (the
# desktop posts them through tauri-plugin-notification, also notify-rust).
notify-rust = "4.16"
# Runs the providers' health checks (their CLIs) when the desktop is closed.
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread"] }

[target.'cfg(target_os = "linux")'.dependencies]
# WebKitGTK's toolkit, for the Browser (the same version wry uses).
gtk = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
# The quick composer's global key while this app hosts the backend (the
# same crate tauri-plugin-global-shortcut uses on the desktop).
global-hotkey = "0.8"
# Tags the Metal layer as sRGB (see src/app/color_space.rs).
objc2 = "0.6"
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "objc2", "CGColorSpace"] }
raw-window-handle = "0.6"
# The Browser's sign-in windows and download save panel, on the same objc2
# crates wry already uses.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSApplication", "NSResponder", "NSWindow", "NSView", "NSPanel", "NSSavePanel", "NSScreen", "NSGraphics", "NSEvent", "NSGraphicsContext", "NSBitmapImageRep", "NSImageRep", "NSImage"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSString", "NSURL", "NSGeometry", "NSThread", "NSHTTPCookie", "NSDictionary", "NSArray", "NSDate", "NSValue", "NSObject", "NSEnumerator", "NSProcessInfo", "NSError", "NSData", "NSUUID", "NSSet", "NSBundle"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "objc2-core-foundation", "WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore", "WKWebsiteDataRecord", "WKHTTPCookieStore", "WKSnapshotConfiguration"] }
# Completion blocks for the Browser's cookie store and snapshots.
block2 = "0.6"
# Voice notes in the person's message: CoreAudio reads Ogg Opus (WhatsApp).
objc2-avf-audio = { version = "0.3", default-features = false, features = ["std", "AVAudioPlayer", "AVAudioFile", "AVAudioBuffer", "AVAudioFormat", "AVAudioTypes", "AVAudioSettings"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes", "CFDictionary", "CFNumber", "CFString"] }
# The Device panel decodes the iOS Simulator's H.264 into the CVPixelBuffer
# GPUI draws (`surface`).
objc2-video-toolbox = { version = "0.3", default-features = false, features = ["std", "VTDecompressionSession", "VTErrors", "VTBase", "objc2-core-media", "objc2-core-video"] }
objc2-core-media = { version = "0.3", default-features = false, features = ["std", "CMBase", "CMBlockBuffer", "CMFormatDescription", "CMSampleBuffer", "CMTime", "objc2-core-video"] }
objc2-core-video = { version = "0.3", default-features = false, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
# Apple's text system for a headless test off the main thread.
gpui_apple = { package = "gpui-pre-apple", version = "=0.3.9", default-features = false, features = ["font-kit", "runtime_shaders"] }

[dev-dependencies]
minisign = "0.7"
# Real Metal rendering in tests that look at a screen (the Device panel).
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", default-features = false, features = ["font-kit", "runtime_shaders", "test-support"] }
gpui = { package = "gpui-pre", version = "=0.3.9", default-features = false, features = ["test-support"] }
tempfile = "3"

# Own workspace: the native app resolves apart from the Tauri app until the switch.
[workspace]
resolver = "2"
members = ["."]
