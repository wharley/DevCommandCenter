[package]
name = "dcc-native"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Native GPUI frontend for Dev Command Center"

[lib]
name = "dcc_native"
path = "src/lib.rs"

[[bin]]
name = "dcc-native"
path = "src/main.rs"

[dependencies]
# Pinned on purpose: same GPUI snapshot Monocode Native ships on.
gpui = { package = "gpui-pre", version = "=0.3.9", default-features = false }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", default-features = false, features = ["font-kit", "runtime_shaders", "x11", "wayland"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
anyhow = "1"
chrono = "0.4"
futures = "0.3"
base64 = "0.22"
smallvec = "1"
unicode-segmentation = "1"
# Project logos: decode an upload and write the 64px PNG DCC stores (both
# already in the tree through GPUI).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
resvg = "0.46"
# Assistant and user messages are GitHub-flavoured markdown (Streamdown on the desktop).
pulldown-cmark = { version = "0.13", default-features = false }
dcc-core = { path = "../../crates/dcc-core" }
dcc-infra = { path = "../../crates/dcc-infra" }
# The provider descriptors, for the model picker before the desktop answers.
dcc-providers = { path = "../../crates/dcc-providers" }
# Diffs (`@pierre/diffs` on the desktop): line and word changes, and
# TextMate-grammar highlighting like its Shiki, with the Pierre themes.
similar = { version = "2", features = ["inline"] }
# The editor's find with "Regexp" on (already in the tree).
regex = "1"
# The terminal's local server addresses (already in the tree through dcc-core).
url = "2"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.4", default-features = false, features = ["syntect-fancy"] }
# The terminal dock's screen and scrollback (xterm.js on the desktop); the
# shells themselves run in the desktop's process.
alacritty_terminal = { version = "0.26", default-features = false }
# The Browser's page: the system's engine (WKWebView, WebView2, WebKitGTK)
# as a child view of the GPUI window, the same library the Tauri app uses.
wry = "0.57"
# Runs the providers' health checks (their CLIs) when the desktop is closed.
tokio = { version = "1", default-features = false, features = ["rt"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Tags the Metal layer as sRGB (see src/app/color_space.rs).
objc2 = "0.6"
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "objc2", "CGColorSpace"] }
raw-window-handle = "0.6"
# The Browser's sign-in windows and download save panel, on the same objc2
# crates wry already uses.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSApplication", "NSResponder", "NSWindow", "NSView", "NSPanel", "NSSavePanel", "NSScreen", "NSGraphics"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL", "NSGeometry", "NSThread"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "objc2-app-kit", "WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore"] }

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.9", default-features = false, features = ["test-support"] }
tempfile = "3"

# Own workspace: the native app resolves apart from the Tauri app until the switch.
[workspace]
resolver = "2"
members = ["."]
