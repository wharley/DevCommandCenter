[package]
name = "dev-command-center-tauri"
version = "0.1.36"
edition = "2021"
license.workspace = true
default-run = "dev-command-center-tauri"

[build-dependencies]
dcc-core = { path = "../crates/dcc-core" }
dcc-tauri = { path = "../crates/dcc-tauri" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "2.0.0-rc.24", features = ["derive"] }
specta-typescript = "0.0.11"
tauri-specta = { version = "2.0.0-rc.24", features = ["typescript"] }
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }

[dependencies]
dcc-core = { path = "../crates/dcc-core" }
dcc-infra = { path = "../crates/dcc-infra" }
dcc-tauri = { path = "../crates/dcc-tauri" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
notify-rust = "4.14"
tauri-plugin-dialog = "2"
portable-pty = "0.8"
regex = "1.10"
lazy_static = "1.4"
tauri-plugin-notification = "2"
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.30"
reqwest = { version = "0.11", features = ["blocking", "json"] }
flate2 = "1"
libc = "0.2"
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
tauri-plugin-updater = "2"
sha2 = "0.10"
hex = "0.4"
async-trait = "0.1"
p256 = { version = "0.13", features = ["ecdsa", "pem"] }
base64 = "0.22"
rand = "0.8"
subtle = "2.5"
thiserror = "1"
local-ip-address = "0.6"

[[bin]]
name = "dccd"
path = "src/bin/dccd.rs"

[[bin]]
name = "dccd-http"
path = "src/bin/dccd-http.rs"

[features]
default = []

[dev-dependencies]
tempfile = "3"
